<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0C">
    <title>Напоминания</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка приложения -->
        <header class="app-header">
            <div class="brand-wrapper">
                <div class="brand-icon" id="brandIconContainer"></div>
                <div>
                    <h1 class="brand-title">Напоминания</h1>
                    <p class="brand-subtitle">Обратный отсчет времени</p>
                </div>
            </div>
            <div class="badge-counter tabular-numbers" id="eventsCountBadge">0 активных</div>
        </header>

        <!-- Список активных событий -->
        <main class="events-list" id="eventsListContainer"></main>

        <!-- Заглушка при отсутствии событий -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon" id="emptyIconContainer"></div>
            <h2 class="empty-title">Нет активных напоминаний</h2>
            <p class="empty-description">Нажмите кнопку ниже, чтобы создать первое событие и запустить обратный отсчет.</p>
        </div>

        <!-- Нижняя панель с кнопкой добавления -->
        <div class="bottom-bar">
            <button class="btn-primary" id="btnOpenCreateModal" onclick="openCreateModal()">
                <span id="btnAddIconContainer"></span>
                <span>Добавить напоминание</span>
            </button>
        </div>
    </div>

    <!-- Модальное окно (Bottom Sheet) создания / редактирования -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target === this) closeModal()">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 class="sheet-title" id="modalSheetTitle">Новое напоминание</h2>
                <button class="sheet-close-btn" id="sheetCloseBtn" onclick="closeModal()" aria-label="Закрыть"></button>
            </div>

            <!-- Форма -->
            <div class="form-group">
                <label class="form-label" for="inputEventTitle">Название события</label>
                <input type="text" class="form-input" id="inputEventTitle" placeholder="Например, Запуск проекта" maxlength="120" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Целевая дата</label>
                <div class="calendar-widget">
                    <div class="calendar-header">
                        <button class="calendar-nav-btn" id="calPrevBtn" onclick="prevMonth()" aria-label="Предыдущий месяц"></button>
                        <span class="calendar-month-title" id="calMonthTitle">Ноябрь 2026</span>
                        <button class="calendar-nav-btn" id="calNextBtn" onclick="nextMonth()" aria-label="Следующий месяц"></button>
                    </div>

                    <div class="calendar-weekdays">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>

                    <div class="calendar-days" id="calDaysGrid"></div>

                    <div class="date-presets">
                        <button class="preset-chip" id="chip-today" onclick="selectPresetDays(0)">Сегодня</button>
                        <button class="preset-chip" id="chip-tomorrow" onclick="selectPresetDays(1)">Завтра</button>
                        <button class="preset-chip" id="chip-7d" onclick="selectPresetDays(7)">+7 дней</button>
                        <button class="preset-chip" id="chip-30d" onclick="selectPresetDays(30)">+30 дней</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="toggle-wrapper" onclick="toggleExactTime()">
                    <span class="toggle-label-text">Указать точное время</span>
                    <div class="ios-toggle" id="exactTimeToggle">
                        <div class="ios-toggle-knob"></div>
                    </div>
                </div>

                <div class="time-picker-accordion" id="timePickerAccordion">
                    <div class="time-inputs-row">
                        <select class="time-select" id="selectHour" aria-label="Часы"></select>
                        <span class="time-colon">:</span>
                        <select class="time-select" id="selectMinute" aria-label="Минуты"></select>
                    </div>
                </div>
            </div>

            <button class="btn-submit-modal" id="btnSubmitModal" onclick="handleSaveEvent()">
                <span id="btnSaveIconContainer"></span>
                <span>Сохранить напоминание</span>
            </button>
        </div>
    </div>

    <!-- Всплывающее уведомление Toast -->
    <div class="toast-notice" id="toastNotice">
        <span id="toastText">Готово</span>
    </div>

    <script src="/static/js/icons.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
